[pytest]
# Pytest configuration for GRCM test suite

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=grcm --cov-report=html
[coverage:run]
source = grcm
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

# Markers for test categorization
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for full pipeline
    slow: Tests that take >1 second
    stress: Stress tests with large batches
    gpu: Tests requiring GPU
    benchmark: Performance benchmark tests

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout (if pytest-timeout installed)
timeout = 300
timeout_method = thread
