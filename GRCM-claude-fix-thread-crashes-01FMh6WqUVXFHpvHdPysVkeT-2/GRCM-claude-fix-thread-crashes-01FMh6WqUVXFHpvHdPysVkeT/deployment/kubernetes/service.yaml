# GRCM Kubernetes Service
apiVersion: v1
kind: Service
metadata:
  name: grcm-api
  namespace: grcm
  labels:
    app: grcm
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: grcm
    component: api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 8000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Internal ClusterIP Service for service mesh
apiVersion: v1
kind: Service
metadata:
  name: grcm-api-internal
  namespace: grcm
  labels:
    app: grcm
    component: api
spec:
  type: ClusterIP
  selector:
    app: grcm
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
---
# Headless Service for StatefulSet (if needed)
apiVersion: v1
kind: Service
metadata:
  name: grcm-api-headless
  namespace: grcm
  labels:
    app: grcm
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: grcm
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grcm-ingress
  namespace: grcm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
  - hosts:
    - grcm.example.com
    secretName: grcm-tls-secret
  rules:
  - host: grcm.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: grcm-api
            port:
              number: 8000
      - path: /ui
        pathType: Prefix
        backend:
          service:
            name: grcm-ui
            port:
              number: 7860
      - path: /mlflow
        pathType: Prefix
        backend:
          service:
            name: mlflow
            port:
              number: 5000
