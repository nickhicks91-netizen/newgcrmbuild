# GRCM ConfigMap for configuration files
apiVersion: v1
kind: ConfigMap
metadata:
  name: grcm-config
  namespace: grcm
  labels:
    app: grcm
data:
  grcm_default.yaml: |
    # GRCM Default Configuration
    input_dim: 15
    freq_dim: 8
    memory_size: 32

    attention:
      freq_dim: 8
      base_bandwidth: 0.5
      coherence_threshold: 0.7
      bandwidth_min: 0.1
      bandwidth_max: 1.0

    memory:
      memory_size: 32
      update_threshold: 0.7

    desire:
      num_desires: 4
      alignment_threshold: 0.5
      bandwidth_bias_scale: 0.2
      default_desire_idx: 0

    threading:
      max_episodes: 50
      min_episodes_for_arc: 2
      arc_scale: 0.1

    phi:
      awareness_threshold: 1.5
      history_max_size: 1000

    body:
      state_dim: 16
      dt: 0.1
      mass: 1.0

    grounding:
      clip_dim: 512
      wav_dim: 768
      prop_dim: 16
      num_heads: 3

    qualia:
      qualia_dim: 4
      qualia_labels:
        - calm
        - alert
        - curious
        - conflicted
      conflict_threshold: 0.6

    training:
      learning_rate: 0.01
      num_epochs: 5
      phi_loss_weight: 1.0

    device: cpu
    dtype: float32
    enable_ethical_halt: true
    enable_logging: false
    log_interval: 10
---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: grcm
  labels:
    name: grcm
    environment: production
---
# Persistent Volume Claim for models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grcm-models-pvc
  namespace: grcm
  labels:
    app: grcm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
# Secret for sensitive data (example)
apiVersion: v1
kind: Secret
metadata:
  name: grcm-secrets
  namespace: grcm
type: Opaque
data:
  mlflow-tracking-uri: aHR0cDovL21sZmxvdzo1MDAwCg==  # base64 encoded
  api-key: Z3JjbS1hcGkta2V5LXNlY3JldAo=  # base64 encoded
