<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoZero: Vine Memory - 3D Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a1f0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #b7ffc3;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(5, 20, 10, 0.85);
            padding: 20px;
            border-radius: 12px;
            min-width: 280px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(119, 255, 170, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #ui-panel h2 {
            margin: 0 0 16px 0;
            color: #9affb2;
            font-size: 1.4em;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(154, 255, 178, 0.3);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(119, 255, 170, 0.1);
        }

        .metric-label {
            color: #88ddaa;
            font-size: 0.9em;
        }

        .metric-value {
            color: #caffe0;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .metric-value.high {
            color: #66ff88;
        }

        .metric-value.low {
            color: #ffcc55;
        }

        .metric-value.critical {
            color: #ff8855;
        }

        /* Buttons */
        .button-group {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #1e6032, #2d8a49);
            color: #caffe0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #2d8a49, #3aa560);
            box-shadow: 0 4px 12px rgba(119, 255, 170, 0.3);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.recording {
            background: linear-gradient(135deg, #8a1e1e, #a62d2d);
        }

        button.recording:hover {
            background: linear-gradient(135deg, #a62d2d, #c03a3a);
        }

        /* Graph */
        #graph-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(5, 20, 10, 0.85);
            padding: 12px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(119, 255, 170, 0.2);
        }

        #graph {
            border-radius: 4px;
        }

        /* Status indicator */
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(5, 20, 10, 0.85);
            padding: 12px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(119, 255, 170, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #66ff88;
            box-shadow: 0 0 10px #66ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            color: #88ddaa;
            font-size: 0.9em;
        }

        /* Loading */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 1.2em;
            color: #9affb2;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 20px auto;
            border: 3px solid rgba(119, 255, 170, 0.2);
            border-top-color: #66ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Help overlay */
        #help {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(5, 20, 10, 0.85);
            padding: 12px 16px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(119, 255, 170, 0.2);
            font-size: 0.85em;
            color: #88ddaa;
            max-width: 250px;
        }

        #help h4 {
            margin: 0 0 8px 0;
            color: #9affb2;
        }

        #help ul {
            list-style: none;
            padding: 0;
        }

        #help li {
            padding: 2px 0;
        }

        .key {
            display: inline-block;
            background: rgba(119, 255, 170, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="loading">
        <div class="spinner"></div>
        <div>Loading EchoZero Visualization...</div>
    </div>

    <div id="ui-panel" style="display: none;">
        <h2>🌿 Vine Memory</h2>

        <div class="metric-row">
            <span class="metric-label">Coherence</span>
            <span class="metric-value high" id="coherence">0.000</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Torsion Energy</span>
            <span class="metric-value" id="torsion">0.000</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Spiral Radius</span>
            <span class="metric-value" id="radius">0.000</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Spiral Angle</span>
            <span class="metric-value" id="angle">0.000</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Möbius Gate</span>
            <span class="metric-value" id="gate">0.000</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Memory Purity</span>
            <span class="metric-value" id="purity">0.000</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Frame</span>
            <span class="metric-value" id="frame">0</span>
        </div>

        <div class="button-group">
            <button id="inject-hallucination">⚠️ Inject Hallucination</button>
            <button id="toggle-mobius">🔁 Toggle Möbius</button>
            <button id="reset-view">🎥 Reset Camera</button>
            <button id="record" class="recording-btn">🔴 Record MP4</button>
        </div>
    </div>

    <div id="status" style="display: none;">
        <div class="status-dot"></div>
        <div class="status-text" id="status-text">Live</div>
    </div>

    <div id="graph-container" style="display: none;">
        <canvas id="graph" width="300" height="100"></canvas>
    </div>

    <div id="help" style="display: none;">
        <h4>Controls</h4>
        <ul>
            <li><span class="key">Left Click + Drag</span> Rotate</li>
            <li><span class="key">Right Click + Drag</span> Pan</li>
            <li><span class="key">Scroll</span> Zoom</li>
            <li><span class="key">Space</span> Pause/Resume</li>
        </ul>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Main application -->
    <script type="module" src="main.js"></script>
</body>
</html>
