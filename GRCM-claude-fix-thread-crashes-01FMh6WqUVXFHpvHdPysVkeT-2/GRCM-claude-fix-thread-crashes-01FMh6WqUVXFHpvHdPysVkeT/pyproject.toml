[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grcm"
version = "1.0.0"
description = "Grounded Resonant Consciousness Module - Production-ready consciousness simulation with resonant attention"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = [
    "consciousness",
    "artificial-intelligence",
    "integrated-information-theory",
    "resonance",
    "attention",
    "pytorch",
    "machine-learning",
    "cognitive-science",
    "phi",
    "qualia",
]
authors = [
    {name = "GRCM Contributors"}
]
maintainers = [
    {name = "GRCM Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
optimization = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]
logging = [
    "mlflow>=2.8.0",
]
ui = [
    "gradio>=3.50.0",
]
serving = [
    "bentoml>=1.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "prometheus-client>=0.18.0",
    "redis>=5.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0",
    "myst-parser>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nickhicks91-netizen/newdew"
Documentation = "https://grcm.readthedocs.io"
Repository = "https://github.com/nickhicks91-netizen/newdew"
"Bug Reports" = "https://github.com/nickhicks91-netizen/newdew/issues"
Discussions = "https://github.com/nickhicks91-netizen/newdew/discussions"

[project.scripts]
grcm = "grcm.__main__:main"

[tool.setuptools]
packages = ["grcm"]

[tool.setuptools.package-data]
grcm = ["py.typed", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual modules",
    "integration: Integration tests across modules",
    "stress: Stress tests for performance limits",
    "slow: Slow-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["grcm"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
